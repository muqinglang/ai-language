server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cached hashed assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API to backend container
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Bundle uploads (POST /api/admin/import-bundle) can be ~1GB (5-segment
        # 1080p collection). Default nginx cap is 1m → 413. Match the API's own
        # _MAX_BUNDLE_BYTES (1GB) plus headroom, and give slow uplinks time.
        client_max_body_size 1100m;
        proxy_request_buffering off;   # stream to backend, don't spool to disk first
        proxy_send_timeout 600s;
        send_timeout 600s;
    }

    # Media files: served directly from the shared volume so nginx's built-in
    # Range request support works (FastAPI StaticFiles returns full 200s for
    # video, which breaks HTML5 seeking).
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Accept-Ranges bytes always;
        expires 1h;
    }

    # Swagger UI
    location = /docs {
        proxy_pass http://api:8000;
    }
    location /openapi.json {
        proxy_pass http://api:8000;
    }

    # SPA fallback — never cache HTML so a redeploy is always picked up next nav.
    # Headers must be on the location that actually serves index.html (the rewrite
    # target), not on a separate `location = /index.html` block, because internal
    # try_files redirects don't re-trigger location matching.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
}
