# Build/typecheck on every push and PR. No deployment — self-hosters wire their
# own deploy; this just keeps the tree buildable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build          # tsc -b && vite build — type errors fail here

  backend:
    name: backend compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q backend/app
